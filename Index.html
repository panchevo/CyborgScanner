<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Blue Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: #001a3d;
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    height: 100vh;
    user-select: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    background:
      /* Белая клетка поверх синего */
      repeating-linear-gradient(0deg, transparent 0 24px, rgba(255,255,255,0.15) 24px 26px),
      repeating-linear-gradient(90deg, transparent 0 24px, rgba(255,255,255,0.15) 24px 26px),
      linear-gradient(135deg, #0a3d91 0%, #001a3d 100%);
  }

  /* ====== ВИДЕО + ОВЕРЛЕЙ ====== */
  #video-container {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(1.05) contrast(1.1) saturate(1.1) hue-rotate(180deg);
  }

  /* Синяя сетка поверх видео */
  #scan-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(0deg, transparent 0 23px, rgba(120,200,255,0.25) 23px 24px),
      repeating-linear-gradient(90deg, transparent 0 23px, rgba(120,200,255,0.25) 23px 24px);
    mix-blend-mode: screen;
  }

  /* Бегущая линия сканирования */
  #scan-line {
    position: absolute;
    left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #7ec8ff, #fff, #7ec8ff, transparent);
    box-shadow: 0 0 20px 6px #7ec8ff;
    animation: scanMove 2.5s linear infinite;
  }
  @keyframes scanMove {
    0%   { top: 0%; }
    100% { top: 100%; }
  }

  /* Уголки рамки */
  .corner {
    position: absolute;
    width: 40px; height: 40px;
    border: 4px solid #7ec8ff;
    box-shadow: 0 0 15px #7ec8ff;
  }
  .corner.tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
  .corner.tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
  .corner.br { bottom: 20px; right: 20px; border-left: none; border-top: none; }

  /* HUD-текст сверху */
  #hud {
    position: absolute;
    top: 12px; left: 0; right: 0;
    text-align: center;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    color: #7ec8ff;
    text-shadow: 0 0 8px #7ec8ff;
    letter-spacing: 2px;
    pointer-events: none;
  }

  /* Боксы распознавания */
  .bounding-box {
    position: absolute;
    border: 2px solid #7ec8ff;
    box-shadow: 0 0 12px #7ec8ff, inset 0 0 12px rgba(126,200,255,0.3);
    pointer-events: none;
    transition: all 0.15s;
  }
  .bounding-box .label {
    position: absolute;
    top: -24px; left: -2px;
    background: #7ec8ff;
    color: #001a3d;
    padding: 2px 8px;
    font-size: 12px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    white-space: nowrap;
    box-shadow: 0 0 10px #7ec8ff;
  }

  /* ====== КОНТРОЛЫ ====== */
  #controls {
    height: 130px;
    background: linear-gradient(180deg, rgba(0,26,61,0.85), #001a3d);
    border-top: 2px solid #7ec8ff;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 20px;
    position: relative;
    z-index: 5;
  }

  #shutter {
    width: 84px; height: 84px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff, #7ec8ff 60%, #0a3d91);
    border: 4px solid #7ec8ff;
    box-shadow: 0 0 25px #7ec8ff, inset 0 0 15px rgba(0,26,61,0.6);
    cursor: pointer;
    transition: transform 0.1s;
  }
  #shutter:active { transform: scale(0.92); }
  #shutter:disabled { opacity: 0.4; }

  .btn {
    background: rgba(126,200,255,0.15);
    color: #7ec8ff;
    border: 2px solid #7ec8ff;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 0 10px rgba(126,200,255,0.4);
  }
  .btn:active {
    background: #7ec8ff;
    color: #001a3d;
  }

  /* ====== ПРЕВЬЮ + РЕЗУЛЬТАТ ====== */
  #preview {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,26,61,0.98), rgba(10,61,145,0.98));
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    overflow-y: auto;
    background-image:
      repeating-linear-gradient(0deg, transparent 0 23px, rgba(255,255,255,0.08) 23px 24px),
      repeating-linear-gradient(90deg, transparent 0 23px, rgba(255,255,255,0.08) 23px 24px);
  }
  #preview.active { display: flex; }

  #preview-img {
    max-width: 100%;
    max-height: 45vh;
    border: 3px solid #7ec8ff;
    box-shadow: 0 0 30px #7ec8ff;
    background: #000;
  }

  #result-box {
    margin-top: 20px;
    width: 100%;
    max-width: 500px;
    background: rgba(0,26,61,0.85);
    border: 2px solid #7ec8ff;
    padding: 16px;
    box-shadow: 0 0 20px rgba(126,200,255,0.5);
    font-family: 'Courier New', monospace;
  }

  #result-title {
    color: #7ec8ff;
    font-size: 13px;
    letter-spacing: 3px;
    margin-bottom: 10px;
    border-bottom: 1px dashed #7ec8ff;
    padding-bottom: 6px;
  }

  .result-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 15px;
    color: #fff;
    border-bottom: 1px solid rgba(126,200,255,0.2);
  }
  .result-row .key { color: #7ec8ff; }
  .result-row .val { font-weight: bold; text-align: right; }

  #status {
    color: #7ec8ff;
    font-size: 14px;
    margin-top: 10px;
    text-align: center;
    font-family: 'Courier New', monospace;
    animation: blink 1s infinite;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0.3; }
  }

  #preview-buttons {
    margin-top: 20px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn-wide {
    padding: 12px 22px;
    font-size: 15px;
  }

  /* Загрузка модели */
  #loading {
    position: fixed;
    inset: 0;
    background: #001a3d;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
    color: #7ec8ff;
    font-family: 'Courier New', monospace;
  }
  #loading.hidden { display: none; }
  #loading .spinner {
    width: 60px; height: 60px;
    border: 4px solid rgba(126,200,255,0.2);
    border-top-color: #7ec8ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div>ЗАГРУЗКА МОДУЛЯ...</div>
  <div style="font-size:12px; margin-top:10px; opacity:0.6;"></div>
</div>

<div id="app">

    <div id="scan-overlay"></div>

  </div>
</div>

<canvas id="canvas" style="display:none"></canvas>

<div id="preview">
  <img id="preview-img" alt="Снимок">
  <div id="result-box">
    <div id="result-title">◈ РЕЗУЛЬТАТ СКАНИРОВАНИЯ ◈</div>
    <div id="result-content">
      <div class="result-row"><span class="key">Объект:</span><span class="val">—</span></div>
    </div>
  </div>
  <div id="status"></div>
  <div id="preview-buttons">
    <button class="btn btn-wide" id="save-btn">💾 Скачать</button>
    <button class="btn btn-wide" id="close-btn">✖ Закрыть</button>

</div>

/* ========================================================================
   2. ИНИЦИАЛИЗАЦИЯ КАМЕРЫ
   ======================================================================== */

async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: facingMode },
        width:  { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });
    video.srcObject = stream;
  } catch (err) {
    alert('Не удалось получить доступ к камере: ' + err.message);
  }
}

/* ========================================================================
   3. ЗАГРУЗКА AI-МОДЕЛИ
   ======================================================================== */

async function loadModel() {
  try {
    model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
    loading.classList.add('hidden');
    startDetection();
  } catch (e) {
    loading.innerHTML = '<div style="color:#f88">Ошибка загрузки модели:<br>' + e.message + '</div>';
  }
}

/* ========================================================================
   4. ДЕТЕКЦИЯ В РЕАЛЬНОМ ВРЕМЕНИ (рисуем боксы)
   ======================================================================== */

async function startDetection() {
  if (!model || !video.videoWidth) {
    detectLoopId = requestAnimationFrame(startDetection);
    return;
  }
  try {
    const predictions = await model.detect(video);
    drawBoxes(predictions);
  } catch (e) {
    // игнорируем
  }
  detectLoopId = setTimeout(startDetection, 250);
}

function drawBoxes(predictions) {
  boxes.innerHTML = '';
  const vw = video.clientWidth;
  const vh = video.clientHeight;
  const nw = video.videoWidth;
  const nh = video.videoHeight;

  // Учитываем object-fit: cover
  const scale = Math.max(vw / nw, vh / nh);
  const offsetX = (vw - nw * scale) / 2;
  const offsetY = (vh - nh * scale) / 2;

  predictions.forEach(p => {
    if (p.score < 0.5) return;
    const [x, y, w, h] = p.bbox;

    // Зеркалим для фронтальной камеры
    const realX = facingMode === 'user'
      ? nw - (x + w)
      : x;

    const box = document.createElement('div');
    box.className = 'bounding-box';
    box.style.left   = (realX * scale + offsetX) + 'px';
    box.style.top    = (y * scale + offsetY) + 'px';
    box.style.width  = (w * scale) + 'px';
    box.style.height = (h * scale) + 'px';

    const label = document.createElement('div');
    label.className = 'label';
    const info = OBJECT_CATEGORIES[p.class] || { type: p.class };
    label.textContent = `${info.type} ${Math.round(p.score * 100)}%`;
    box.appendChild(label);
    boxes.appendChild(box);
  });
}

/* ========================================================================
   5. СЪЁМКА + РАСПОЗНАВАНИЕ
   ======================================================================== */

async function takePhoto() {
  if (!stream || !model) return;

  const w = video.videoWidth;
  const h = video.videoHeight;
  if (!w || !h) return;

  shutter.disabled = true;

  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');

  // Зеркалим фронталку
  if (facingMode === 'user') {
    ctx.translate(w, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(video, 0, 0, w, h);

  // Синий «сканерный» эффект на снимке
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  applyScannerEffect(ctx, w, h);

  currentPhoto = canvas.toDataURL('image/jpeg', 0.92);
  previewImg.src = currentPhoto;
  preview.classList.add('active');

  resultBox.innerHTML =
    '<div class="result-row"><span class="key">Статус:</span>' +
    '<span class="val">⏳ Анализ...</span></div>';
  statusEl.textContent = '◈ РАСПОЗНАВАНИЕ ОБЪЕКТА ◈';

  // Распознавание на этом кадре
  try {
    const predictions = await model.detect(canvas);
    showResults(predictions);
  } catch (e) {
    resultBox.innerHTML =
      '<div class="result-row"><span class="key">Ошибка:</span>' +
      '<span class="val">' + e.message + '</span></div>';
    statusEl.textContent = '';
  }

  shutter.disabled = false;
}

/* ========================================================================
   6. ЭФФЕКТ СКАНЕРА НА ФОТО
   ======================================================================== */

function applyScannerEffect(ctx, w, h) {
  // Синий оттенок + клетка
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = 'rgba(30, 100, 200, 0.25)';
  ctx.fillRect(0, 0, w, h);
  ctx.restore();

  // Сетка
  ctx.save();
  ctx.strokeStyle = 'rgba(126, 200, 255, 0.25)';
  ctx.lineWidth = 1;
  const step = 26;
  for (let x = 0; x <= w; x += step) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  for (let y = 0; y <= h; y += step) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }
  ctx.restore();

  // Виньетка
  const grad = ctx.createRadialGradient(w/2, h/2, Math.min(w,h)*0.3, w/2, h/2, Math.max(w,h)*0.7);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,20,60,0.5)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
}

/* ========================================================================
   7. ФОРМИРОВАНИЕ РЕЗУЛЬТАТА
   ======================================================================== */

function formatPrice(min, max) {
  const fmt = n => n.toLocaleString('ru-RU') + ' ₽';
  return `${fmt(min)} — ${fmt(max)}`;
}

function getRandomFromRange(min, max, step = 100) {
  const steps = Math.floor((max - min) / step);
  const val = min + Math.floor(Math.random() * (steps + 1)) * step;
  return val;
}

function showResults(predictions) {
  statusEl.textContent = '';
  resultBox.innerHTML = '';

  if (!predictions || predictions.length === 0) {
    addRow('Объект', '❌ Не распознан');
    addRow('Совет', 'Приблизьте объект к камере');
    return;
  }

  // Берём топ-3 предсказания
  const top = predictions
    .filter(p => p.score > 0.4)
    .sort((a, b) => b.score - a.score)
    .slice(0, 3);

  if (top.length === 0) {
    addRow('Объект', '❌ Не распознан');
    return;
  }

  top.forEach((p, i) => {
    const info = OBJECT_CATEGORIES[p.class] || { cat: 'Объект', type: p.class };
    const conf = Math.round(p.score * 100);

    if (i > 0) {
      const divider = document.createElement('div');
      divider.style.cssText = 'margin-top:14px; padding-top:10px; border-top: 1px dashed rgba(126,200,255,0.4);';
      resultBox.appendChild(divider);
      const sub = document.createElement('div');
      sub.style.cssText = 'color:#7ec8ff; font-size:12px; margin-bottom:6px;';
      sub.textContent = `▸ Вариант ${i + 1}`;
      resultBox.appendChild(sub);
    }

    addRow('Название', info.type || p.class);
    addRow('Категория', info.cat || '—');
    addRow('Уверенность', conf + '%');

    // Если это человек
    if (p.class === 'person') {
      addRow('Пол', '👤 ' + guessGender());
      addRow('Возраст', '👥 ' + guessAge());
      addRow('Вид', 'Человек разумный');
      addRow('Эмоция', '🙂 ' + guessEmotion());
    }
    // Если животное
    else if (info.cat === 'Животное') {
      addRow('Вид', info.species || info.type);
      addRow('Пол', '🐾 ' + guessGender());
      addRow('Возраст', '🐾 ' + guessAge());
    }
    // Если товар или транспорт
    else if (info.price) {
      const price = getRandomFromRange(info.price[0], info.price[1],
        info.price[0] > 10000 ? 1000 : 10);
      addRow('Ориентир. цена', '💰 ' + price.toLocaleString('ru-RU') + ' ₽');
      addRow('Диапазон', formatPrice(info.price[0], info.price[1]));
      addRow('Наличие', Math.random() > 0.3 ? '✅ Есть' : '⚠️ Уточняйте');
    }

    if (i === 0) {
      addRow('Точность рамки', Math.round(p.bbox[2]) + '×' + Math.round(p.bbox[3]) + ' px');
    }
  });
}

function addRow(key, val) {
  const row = document.createElement('div');
  row.className = 'result-row';
  row.innerHTML = `<span class="key">${key}:</span><span class="val">${val}</span>`;
  resultBox.appendChild(row);
}

/* ========================================================================
   8. ПРИБЛИЗИТЕЛЬНЫЕ ОПРЕДЕЛЕНИЯ (демо-эвристики)
   ======================================================================== */

function guessGender() {
  // В реальности нужна отдельная модель. Здесь — имитация для демонстрации.
  return Math.random() > 0.5 ? 'Мужской' : 'Женский';
}

function guessAge() {
  const ages = ['0-12 (ребёнок)', '13-19 (подросток)', '20-35 (молодой)',
                '36-55 (взрослый)', '56+ (пожилой)'];
  return ages[Math.floor(Math.random() * ages.length)];
}

function guessEmotion() {
  const e = ['Нейтральное', 'Улыбка', 'Задумчивое', 'Радость', 'Спокойствие'];
  return e[Math.floor(Math.random() * e.length)];
}

   9. ОБРАБОТЧИКИ СОБЫТИЙ

switchBtn.addEventListener('click', () => {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  startCamera();
});

infoBtn.addEventListener('click', () => {
  alert(

    '• Наведите камеру на объект\n' +
    '• Нажмите круглую кнопку для съёмки\n' +
    '• AI распознает объект и покажет:\n' +
    '   — название\n' +
    '   — категорию\n' +
    '   — ориентировочную цену (для товаров)\n' +
    '   — пол/вид (для людей и животных)\n\n' +
    'Работает офлайн, модель — COCO-SSD (80 классов).'
  );
});

saveBtn.addEventListener('click', () => {
  if (!currentPhoto) return;
  const a = document.createElement('a');
  a.href = currentPhoto;
  a.download = 'scan_' + Date.now() + '.jpg';
  a.click();
});

closeBtn.addEventListener('click', () => {
  preview.classList.remove('active');
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden && stream) {
    stream.getTracks().forEach(t => t.stop());
  } else if (!document.hidden) {
    startCamera();
  }
});

(async function init() {
  await startCamera();
  await loadModel();
})();
